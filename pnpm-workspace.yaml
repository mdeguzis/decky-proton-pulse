allowBuilds:
  core-js: true
  esbuild: true
onlyBuiltDependencies:
  - esbuild
  - core-js
# pnpm 11+ moved settings out of package.json's "pnpm" field. This file is
# the new home. We're not actually using workspaces here, but pnpm reads
# peerDependencyRules from here even in single-package repos.
#
# ignoreMissing: react / react-dom are provided by @decky/ui at runtime on
# the Steam Deck, so silence the "peer dep missing" warning during install.
peerDependencyRules:
  ignoreMissing:
    - react
    - react-dom

# danger (Translation coverage CI check) pins undici 6.x below the fixes for
# GHSA-35p6-xmwp-9g52, GHSA-r53p-7pc4-xj5r and related advisories. Same major,
# so lifting it is safe. Drop this once danger ships a patched undici.
overrides:
  undici@6: ^6.28.1
