name: Coverage Badges

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: coverage-badges-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  get-windows-version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Get Windows OS version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-CimInstance Win32_OperatingSystem).Version
          echo "version=$v" >> $env:GITHUB_OUTPUT

  build-coverage:
    runs-on: ubuntu-latest
    needs: [get-windows-version]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python dependencies
        run: uv sync --group dev

      - name: Collect and enforce coverage
        run: make coverage

      - name: Generate OS version badges
        env:
          WINDOWS_VER: ${{ needs.get-windows-version.outputs.version }}
        run: |
          mkdir -p coverage/site/badges

          badge() {
            local file="$1" label="$2" message="$3" color="$4"
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' \
              "$label" "$message" "$color" > "coverage/site/badges/$file"
          }

          # Ubuntu -- host runner, no container pull needed
          UBUNTU_VER=$(lsb_release -sr 2>/dev/null || echo '?')
          badge "os-ubuntu.json"   "ubuntu:latest"      "$UBUNTU_VER"  "e95420"

          # Fedora
          FEDORA_VER=$(docker run --rm fedora:latest bash -c \
            'source /etc/os-release && echo "$VERSION_ID"' 2>/dev/null || echo '?')
          badge "os-fedora.json"   "fedora:latest"      "$FEDORA_VER"  "3c6eb4"

          # Debian
          DEBIAN_VER=$(docker run --rm debian:12 bash -c \
            'source /etc/os-release && echo "$VERSION_ID"' 2>/dev/null || echo '?')
          badge "os-debian.json"   "debian:12"          "$DEBIAN_VER"  "a80030"

          # Arch Linux (rolling -- VERSION_ID is the image datestamp)
          ARCH_VER=$(docker run --rm archlinux:latest bash -c \
            'source /etc/os-release && echo "${VERSION_ID:-rolling}"' 2>/dev/null || echo 'rolling')
          badge "os-arch.json"     "archlinux:latest"   "$ARCH_VER"    "1793d1"

          # Termux -- get termux-tools package version from the docker image
          TERMUX_VER=$(docker run --rm termux/termux-docker:x86_64 \
            bash -c 'PATH=/data/data/com.termux/files/usr/bin:$PATH \
              dpkg-query -W -f='"'"'${Version}'"'"' termux-tools 2>/dev/null' \
            2>/dev/null | tr -d '\r\n')
          [ -z "$TERMUX_VER" ] && TERMUX_VER='latest'
          badge "os-termux.json"   "termux:x86_64"      "$TERMUX_VER"  "262626"

          # Windows -- version captured from windows-latest runner job above
          WIN_VER="${WINDOWS_VER:-?}"
          badge "os-windows.json"  "windows-latest"     "$WIN_VER"     "0078d4"

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage/site

  deploy-pages:
    needs: build-coverage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
