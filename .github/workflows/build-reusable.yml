name: Build Reusable

on:
  workflow_call:
    inputs:
      workflow_name:
        required: true
        type: string
      container_image:
        required: false
        type: string
        default: ""
      install_cmd:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-host:
    if: ${{ inputs.container_image == '' }}
    name: ${{ inputs.workflow_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python dependencies
        run: uv sync --group dev

      - name: Build
        run: make build

  build-container:
    if: ${{ inputs.container_image != '' }}
    name: ${{ inputs.workflow_name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container_image }}

    steps:
      - name: Install system packages
        if: ${{ inputs.install_cmd != '' }}
        run: ${{ inputs.install_cmd }}

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python dependencies
        run: uv sync --group dev

      - name: Build
        run: make build
