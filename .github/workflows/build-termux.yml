name: Build Termux

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Termux Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix workspace permissions for container
        run: chmod -R 777 "$GITHUB_WORKSPACE"

      - name: Build in Termux container
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e CI=true \
            -e EVENT_NAME="$EVENT_NAME" \
            -e BASE_REF="$BASE_REF" \
            termux/termux-docker:x86_64 \
            bash -c '
              set -euo pipefail
              export HOME="${HOME:-/data/data/com.termux/files/home}"
              export PATH=/data/data/com.termux/files/usr/bin:$PATH
              export UV_CACHE_DIR="$HOME/.cache/uv"
              export UV_PYTHON_PREFERENCE=system

              # switch to the official Termux CDN -- the default mirror
              # in this Docker image is unreliable for large packages
              echo "deb https://packages.termux.dev/apt/termux-main stable main" \
                > /data/data/com.termux/files/usr/etc/apt/sources.list

              mkdir -p "$UV_CACHE_DIR"
              pkg update -y
              pkg install -y curl make python rsync uv xz-utils

              # Standard Linux node instead of Termux nodejs-lts.
              # Termux node reports process.platform="android" which makes
              # pnpm install @esbuild/android-x64 (Bionic libc) instead of
              # @esbuild/linux-x64 (glibc). The android binary cant execute
              # in this glibc-based Docker host, so postinstall ENOENT errors.
              NODE_VER=20.18.1
              NODE_DIR="$HOME/.local/node"
              mkdir -p "$NODE_DIR"
              curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-linux-x64.tar.xz" \
                | tar -xJ --strip-components=1 -C "$NODE_DIR"

              # patch shebangs: Termux lacks /usr/bin/env, so point
              # npm/npx/corepack directly at the node binary
              sed -i "1s|#!/usr/bin/env node|#!${NODE_DIR}/bin/node|" \
                "$NODE_DIR/bin/npm" "$NODE_DIR/bin/npx" "$NODE_DIR/bin/corepack"

              export PATH="$NODE_DIR/bin:$PATH"

              # pin to pnpm v9 to match the v9.0 lockfile format
              npm install -g pnpm@9
              # patch the freshly installed pnpm shebang too
              for f in "$NODE_DIR"/bin/pnpm*; do
                [ -f "$f" ] && sed -i "1s|#!/usr/bin/env node|#!${NODE_DIR}/bin/node|" "$f"
              done

              python3 --version
              node --version
              pnpm --version
              uv --version

              pnpm install --frozen-lockfile

              # patch bin stubs that pnpm created in node_modules
              for f in /workspace/node_modules/.bin/*; do
                t=$(readlink -f "$f" 2>/dev/null) || continue
                sed -i "1s|#!/usr/bin/env node|#!${NODE_DIR}/bin/node|" "$t" 2>/dev/null || true
              done

              uv sync --group dev
              make build

              if [ "$EVENT_NAME" = "pull_request" ]; then
                git config --global --add safe.directory /workspace
                git fetch origin "${BASE_REF}:${BASE_REF}"
                DIFF_COVERAGE_BASE="origin/${BASE_REF}" pnpm run coverage:diff
              fi
            '
