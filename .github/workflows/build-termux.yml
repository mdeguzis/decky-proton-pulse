name: Build Termux

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Termux Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix workspace permissions for container
        run: chmod -R 777 "$GITHUB_WORKSPACE"

      - name: Build in Termux container
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e CI=true \
            -e EVENT_NAME="$EVENT_NAME" \
            -e BASE_REF="$BASE_REF" \
            termux/termux-docker:x86_64 \
            bash -c '
              set -euo pipefail
              export PATH=/data/data/com.termux/files/usr/bin:$PATH
              export UV_CACHE_DIR=/data/data/com.termux/files/home/.cache/uv
              export UV_PYTHON_PREFERENCE=system

              # switch to the official Termux CDN -- the default mirror
              # in this Docker image is unreliable for large packages
              echo "deb https://packages.termux.dev/apt/termux-main stable main" \
                > /data/data/com.termux/files/usr/etc/apt/sources.list

              mkdir -p "$UV_CACHE_DIR"
              pkg update -y
              pkg install -y curl git make python rsync uv xz-utils

              # Standard Linux node instead of Termux nodejs-lts.
              # Termux node reports process.platform="android" which makes
              # pnpm install @esbuild/android-x64 (Bionic libc) instead of
              # @esbuild/linux-x64 (glibc). The android binary cant run in
              # this Docker host, so the postinstall ENOENT errors out.
              NODE_VER=20.18.1
              mkdir -p /opt/node
              curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-linux-x64.tar.xz" \
                | tar -xJ --strip-components=1 -C /opt/node/
              export PATH="/opt/node/bin:$PATH"

              # pin to pnpm v9 to match the v9.0 lockfile format
              npm install -g pnpm@9

              python3 --version
              node --version
              pnpm --version
              uv --version

              pnpm install --frozen-lockfile
              uv sync --group dev
              make build

              if [ "$EVENT_NAME" = "pull_request" ]; then
                git config --global --add safe.directory /workspace
                git fetch origin "${BASE_REF}:${BASE_REF}"
                DIFF_COVERAGE_BASE="origin/${BASE_REF}" pnpm run coverage:diff
              fi
            '
