name: Build Bazzite

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    name: Bazzite Build
    runs-on: ubuntu-latest
    steps:
      - name: Install crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: Import Bazzite as single-layer image
        run: |
          crane export ghcr.io/ublue-os/bazzite:latest - \
            | docker import --change 'CMD ["/bin/bash"]' - bazzite:ci
          docker images bazzite:ci

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build inside Bazzite container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            bazzite:ci \
            bash -c "
              set -euo pipefail
              dnf install -y bash ca-certificates curl git make rsync unzip xz nodejs npm python3 &&
              curl -fsSL https://get.pnpm.io/install.sh | env PNPM_HOME=/usr/bin sh - &&
              curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/bin sh - &&
              pnpm install --frozen-lockfile &&
              uv sync --group dev &&
              make build
            "
