# Keep src/data/proton-env-support.json on each Proton family's newest
# release (proton-pulse-web#564, #135).
#
# Daily, scripts/extract-proton-env-support.py --latest asks GitHub for the
# newest GE-Proton and Proton-CachyOS release and the newest Valve stable and
# Experimental tag. If any changed, it re-extracts the switches and this job
# opens (or updates) a PR into dev so the switch diff gets a human review
# before it ships in the plugin. Nothing changed means no commit, no PR.
#
# Opening the PR needs the repo setting "Allow GitHub Actions to create and
# approve pull requests", turned on 2026-10-29 for this job. The default
# token stays read-only; only this job asks for contents + pull-requests
# write. The web pipeline publishes the merged file to Cloudflare.

name: Proton env support (newest tags)

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: proton-env-support
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: auto/proton-env-support
      DATA: src/data/proton-env-support.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract switches from each family's newest tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # tee + pipefail: a failed fetch fails the job with its error in the log.
          python3 scripts/extract-proton-env-support.py --latest 2>&1 | tee extract.log

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$DATA"; then
            echo "No newer tags; nothing to propose."
            exit 0
          fi
          changes=$(grep -E '^[a-z-]+: .+ -> .+$' extract.log || true)
          git config user.name "mdeguzis"
          git config user.email "mdeguzis@gmail.com"
          git checkout -B "$BRANCH"
          git add "$DATA"
          git commit -m "chore(data): refresh proton-env-support.json for new Proton releases" -m "$changes" -m "Generated by .github/workflows/proton-env-support.yml (proton-pulse-web#564)."
          git push --force origin "$BRANCH"
          body=$(printf 'Newer Proton releases were found, so the switch matrix was re-extracted:\n\n```\n%s\n```\n\nReview the switches / env_reads diff in %s before merging. Generated by the proton-env-support workflow (proton-pulse-web#564).\n' "$changes" "$DATA")
          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "PR already open; branch updated."
          else
            gh pr create --base dev --head "$BRANCH" --title "Refresh proton-env-support.json for new Proton releases" --body "$body"
          fi
